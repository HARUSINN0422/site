<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b50">
<title>Color Drop</title>
<style>
:root{color-scheme:dark;--ink:#eff8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;background:radial-gradient(ellipse at 50% 0%,#2879b4 0,#125080 34%,#092e54 70%,#061b35 100%);overflow-x:hidden}
main{width:min(100%,520px)}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.scorebox{display:flex;align-items:baseline;gap:10px}
.scorebox small{font-size:12px;letter-spacing:.14em;color:#b4d8f2}
#score{font-size:clamp(27px,7vw,36px);font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px #8bd8ff55}
#best{font-size:12px;color:#c1dff5;margin-left:5px}
button{width:42px;height:42px;border:1px solid #a8dcff70;border-radius:50%;background:linear-gradient(145deg,#2875aa,#10436f);color:#effaff;font-size:21px;box-shadow:0 4px 14px #001a35aa;cursor:pointer}
button:active{transform:scale(.93)}
.arena{position:relative;width:100%;height:min(72vh,680px);min-height:470px;border-radius:34px;overflow:hidden;border:1px solid #9bdcff80;background:linear-gradient(180deg,#0b3965 0%,#092d52 55%,#071f3d 100%);box-shadow:0 22px 55px #00152eaa,inset 0 2px 12px #a7e1ff20;touch-action:none}
.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#66c8ff20,transparent 60%),linear-gradient(90deg,#061b3520,transparent 15%,transparent 85%,#061b3520)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.under{display:flex;justify-content:space-between;align-items:center;padding:11px 5px 0;color:#b1d3ed;font-size:12px;min-height:32px}
#chain{font-size:14px;color:#fff;font-weight:750;text-shadow:0 0 10px #83d9ff}
@media(max-width:390px){body{padding:8px 7px}.arena{height:70vh;min-height:430px;border-radius:26px}.top{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
 <div class="top"><div class="scorebox"><small>SCORE</small><strong id="score">0</strong><span id="best">BEST 0</span></div><button id="reset" type="button" aria-label="リセット" title="最初から">↻</button></div>
 <div class="arena"><canvas id="game"></canvas></div>
 <div class="under"><span id="chain"></span><span>COLOR DROP</span></div>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),arena=canvas.parentElement;
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),chainEl=document.getElementById("chain");
const colors=["#ff647d","#ffd34e","#56d99a","#aa86ff","#ff9852"];
let W=0,H=0,D=1,R=23,balls=[],chain=[],active=false,pointer=null,score=0,best=0,last=0,raf=0,clearing=false;
const randColor=()=>Math.floor(Math.random()*colors.length);
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
 const rect=arena.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=rect.width;H=rect.height;
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 R=Math.max(16,Math.min(25,W/17.5));
 if(!balls.length)seed();else{for(const b of balls){b.x=Math.max(R,Math.min(W-R,b.x));b.y=Math.max(R,Math.min(H-R,b.y))}}
}
function makeBall(x,y,color=randColor(),vy=0){return{x,y,vx:rand(-.35,.35),vy,r:R*rand(.94,1.04),color,spin:rand(0,Math.PI*2),born:0,dead:false}}
function seed(){
 balls=[];const spacing=R*2.02;
 for(let row=0;row<Math.ceil((H-R*2)/spacing);row++){
  const offset=row%2?R:0;
  for(let x=R+offset;x<W-R;x+=spacing){balls.push(makeBall(x+rand(-1.8,1.8),R+row*spacing,randColor(),rand(-.2,.3)))}
 }
}
function addBall(){balls.push(makeBall(rand(R,W-R),-R*2,randColor(),rand(0,1)))}
function scoreUI(){scoreEl.textContent=score.toLocaleString("ja-JP");bestEl.textContent="BEST "+best}
function nearest(x,y,maxDist=R*1.45,exclude=new Set()){
 let found=null,dist=maxDist;
 for(const b of balls){if(b.dead||exclude.has(b))continue;const d=Math.hypot(b.x-x,b.y-y);if(d<dist){dist=d;found=b}}
 return found;
}
function start(e){
 if(clearing)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
 const b=nearest(x,y,R*1.35);if(!b)return;
 e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer=e.pointerId;active=true;chain=[b];chainEl.textContent="1 CHAIN";draw();
}
function move(e){
 if(!active||e.pointerId!==pointer)return;
 const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
 const lastBall=chain[chain.length-1];if(!lastBall)return;
 const already=new Set(chain);
 // Pick the next matching orb that the finger passes over and that touches the current chain end.
 const candidates=balls.filter(b=>!b.dead&&!already.has(b)&&b.color===chain[0].color&&Math.hypot(b.x-lastBall.x,b.y-lastBall.y)<lastBall.r+b.r+R*.38);
 let chosen=null,bestD=R*1.5;
 for(const b of candidates){const d=Math.hypot(b.x-x,b.y-y);if(d<bestD){bestD=d;chosen=b}}
 if(chosen){chain.push(chosen);chainEl.textContent=chain.length+" CHAIN";draw()}
}
function end(){if(!active)return;active=false;pointer=null;if(chain.length>=3)clearChain();else{chain=[];chainEl.textContent="";draw()}}
canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",end);
canvas.addEventListener("pointercancel",()=>{active=false;pointer=null;chain=[];chainEl.textContent="";draw()});
function clearChain(){
 clearing=true;const removed=chain.slice();const n=removed.length;score+=n*n*10;best=Math.max(best,n);scoreUI();chainEl.textContent=n+" CHAIN";
 for(const b of removed)b.dead=true;chain=[];
 setTimeout(()=>{balls=balls.filter(b=>!b.dead);for(let i=0;i<n;i++)addBall();clearing=false;chainEl.textContent="";},160);
}
function physics(dt){
 const step=Math.min(dt,24)/16.6667,g=.31*step;
 for(const b of balls){
  b.vy+=g;b.vx*=.999;b.vy*=.999;b.x+=b.vx*step;b.y+=b.vy*step;
  if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.72}
  if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.72}
  if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.48}
  if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.28;if(Math.abs(b.vy)<.55)b.vy=0}
 }
 // Circle-to-circle collisions; a small positional correction keeps the pile stable.
 for(let pass=0;pass<2;pass++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
  const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;
  if(dist>=min||dist===0)continue;
  const nx=dx/dist,ny=dy/dist,overlap=min-dist;
  a.x-=nx*overlap*.5;a.y-=ny*overlap*.5;b.x+=nx*overlap*.5;b.y+=ny*overlap*.5;
  const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
  if(rel<0){const impulse=-(1.22)*rel*.5;a.vx-=impulse*nx;a.vy-=impulse*ny;b.vx+=impulse*nx;b.vy+=impulse*ny}
 }
}
function drawBall(b){
 const grad=ctx.createRadialGradient(b.x-b.r*.36,b.y-b.r*.43,b.r*.06,b.x,b.y,b.r*1.12);
 grad.addColorStop(0,"#ffffff");grad.addColorStop(.12,colors[b.color]);grad.addColorStop(.68,colors[b.color]);grad.addColorStop(1,"#152b53");
 ctx.save();ctx.shadowColor=colors[b.color];ctx.shadowBlur=7;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowBlur=0;
 ctx.lineWidth=1;ctx.strokeStyle="#ffffff70";ctx.stroke();
 ctx.beginPath();ctx.ellipse(b.x-b.r*.23,b.y-b.r*.43,b.r*.38,b.r*.17,-.48,0,Math.PI*2);ctx.fillStyle="#ffffff9c";ctx.fill();
 ctx.beginPath();ctx.ellipse(b.x+b.r*.34,b.y+b.r*.42,b.r*.15,b.r*.09,-.5,0,Math.PI*2);ctx.fillStyle="#ffffff50";ctx.fill();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // Subtle arena lighting
 const light=ctx.createRadialGradient(W*.5,0,5,W*.5,H*.35,H*.85);light.addColorStop(0,"#65bfff12");light.addColorStop(1,"#00152a00");ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
 for(const b of balls)drawBall(b);
 if(chain.length){
  ctx.save();ctx.beginPath();chain.forEach((b,i)=>i?ctx.lineTo(b.x,b.y):ctx.moveTo(b.x,b.y));ctx.lineWidth=R*.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#ffffffd9";ctx.shadowColor="#8be2ff";ctx.shadowBlur=15;ctx.stroke();
  for(const b of chain){ctx.beginPath();ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2);ctx.strokeStyle="#ffffff";ctx.lineWidth=2.5;ctx.stroke()}
  ctx.restore();
 }
}
function loop(t){const dt=last?t-last:16.67;last=t;physics(dt);draw();raf=requestAnimationFrame(loop)}
function reset(){score=0;best=0;chain=[];active=false;pointer=null;clearing=false;seed();scoreUI();chainEl.textContent=""}
document.getElementById("reset").addEventListener("click",reset);
new ResizeObserver(resize).observe(arena);resize();scoreUI();raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
