<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182e">
<title>Blue Orbs</title>
<style>
:root{color-scheme:dark;--ink:#eaf6ff;--blue:#64c9ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px;background:radial-gradient(ellipse at 50% 8%,#153d67 0,#0a2544 38%,#061426 100%);overflow-x:hidden}
main{width:min(100%,520px)}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 3px 12px}
.scorebox{display:flex;align-items:baseline;gap:9px}
.scorebox small{font-size:12px;letter-spacing:.12em;color:#91b9d8}
#score{font-size:clamp(25px,7vw,34px);font-weight:750;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 2px 16px #55baff55}
#best{font-size:13px;color:#a8c9e5;margin-left:8px}
button{width:42px;height:42px;border:1px solid #8bcfff55;border-radius:50%;background:linear-gradient(145deg,#1b4d78,#102d4c);color:#dff5ff;font-size:21px;box-shadow:0 4px 14px #0004;cursor:pointer}
button:active{transform:scale(.93)}
.frame{position:relative;padding:8px;border-radius:25px;background:linear-gradient(145deg,#28608a,#12395f 45%,#0c2a49);border:1px solid #83caff55;box-shadow:0 18px 48px #0008,inset 0 1px #ffffff25}
#board{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(2px,.8vw,5px);touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;min-width:0;position:relative;display:grid;place-items:center}
.orb{width:97%;height:97%;border-radius:50%;position:relative;border:1px solid #d9f3ff65;box-shadow:inset -5px -7px 10px #00172d65,inset 3px 4px 8px #ffffff65,0 3px 5px #001326a8;will-change:transform;transform:translateZ(0);transition:transform .11s cubic-bezier(.2,.8,.2,1),filter .11s;overflow:hidden}
.orb:before{content:"";position:absolute;left:17%;top:11%;width:48%;height:25%;border-radius:50%;background:linear-gradient(180deg,#fffebd,#ffffff22);filter:blur(1.5px);transform:rotate(-28deg);opacity:.86}
.orb:after{content:"";position:absolute;right:17%;bottom:14%;width:17%;height:12%;border-radius:50%;background:#e5f7ff55;filter:blur(2px)}
.c0{background:radial-gradient(circle at 34% 26%,#c6efff 0%,#55b8ff 33%,#1875c9 72%,#0b438e 100%)}
.c1{background:radial-gradient(circle at 34% 26%,#d5f8ff 0%,#68e0f4 32%,#159ecb 72%,#08618f 100%)}
.c2{background:radial-gradient(circle at 34% 26%,#d7e5ff 0%,#829eff 34%,#4166d6 72%,#263b91 100%)}
.c3{background:radial-gradient(circle at 34% 26%,#d0f4ff 0%,#50c9df 32%,#197fba 72%,#124b7e 100%)}
.c4{background:radial-gradient(circle at 34% 26%,#e0eaff 0%,#a1c5f7 33%,#5489ce 72%,#2b568f 100%)}
.orb.selected{transform:scale(1.08);filter:brightness(1.22);z-index:2;box-shadow:inset -4px -6px 9px #00172d55,inset 3px 4px 8px #ffffff88,0 0 0 2px #e9faff,0 0 15px 5px #6bcaffb8}
.orb.popping{transform:scale(.05) rotate(35deg);opacity:0;filter:brightness(2);transition:transform .19s cubic-bezier(.2,.8,.2,1),opacity .16s}
@keyframes drop{0%{transform:translateY(-95%) scale(.88);opacity:.25}65%{transform:translateY(5%) scale(1.025)}82%{transform:translateY(-2%) scale(.99)}100%{transform:translateY(0) scale(1);opacity:1}}
.orb.fresh{animation:drop .38s cubic-bezier(.2,.72,.25,1) both}
#trail{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:3}
#trail path{fill:none;stroke:#e7f8ff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;filter:drop-shadow(0 0 5px #5acaff) drop-shadow(0 0 10px #3daaff)}
#trail circle{fill:#e8faff;filter:drop-shadow(0 0 5px #59caff)}
.under{display:flex;justify-content:space-between;align-items:center;padding:11px 5px 0;color:#86abc9;font-size:12px}
#chain{font-size:14px;color:#d5efff;font-weight:650;min-height:20px}
@media(max-width:390px){body{padding:9px 7px}.frame{padding:6px;border-radius:19px}.top{margin-bottom:8px}.under{padding-top:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="scorebox"><small>SCORE</small><strong id="score">0</strong><span id="best">BEST 0</span></div>
    <button id="reset" type="button" aria-label="リセット" title="最初から">↻</button>
  </div>
  <div class="frame"><div id="board"><svg id="trail" aria-hidden="true"><path id="trailPath"></path></svg></div></div>
  <div class="under"><span id="chain"></span><span>BLUE ORBS</span></div>
</main>
<script>
(() => {
"use strict";
const COLS=8,ROWS=9,COLORS=5;
const boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),chainEl=document.getElementById("chain"),trail=document.getElementById("trail"),trailPath=document.getElementById("trailPath");
let board=[],score=0,best=0,path=[],active=false,busy=false,pointerId=null;
const idx=(r,c)=>r*COLS+c,rc=i=>[Math.floor(i/COLS),i%COLS],randomColor=()=>Math.floor(Math.random()*COLORS);
function adjacent(a,b){const [ar,ac]=rc(a),[br,bc]=rc(b);return Math.max(Math.abs(ar-br),Math.abs(ac-bc))===1}
function render(fresh=new Set()){
  boardEl.querySelectorAll(".cell").forEach(el=>el.remove());
  board.forEach((color,i)=>{
    const cell=document.createElement("div");cell.className="cell";cell.dataset.index=i;
    if(color!==null){const orb=document.createElement("div");orb.className="orb c"+color+(path.includes(i)?" selected":"")+(fresh.has(i)?" fresh":"");orb.dataset.index=i;cell.appendChild(orb)}
    boardEl.insertBefore(cell,trail);
  });
  scoreEl.textContent=score.toLocaleString("ja-JP");bestEl.textContent="BEST "+best;
  chainEl.textContent=active&&path.length>1?path.length+" CHAIN":"";
  drawTrail();
}
function center(i){const el=boardEl.querySelector('.cell[data-index="'+i+'"]');if(!el)return null;const a=el.getBoundingClientRect(),b=boardEl.getBoundingClientRect();return{x:a.left+a.width/2-b.left,y:a.top+a.height/2-b.top}}
function drawTrail(){
  if(path.length<2){trailPath.setAttribute("d","");return}
  const pts=path.map(center).filter(Boolean);if(pts.length<2)return;
  let d="M "+pts[0].x+" "+pts[0].y;
  for(let i=1;i<pts.length;i++){const prev=pts[i-1],cur=pts[i],mx=(prev.x+cur.x)/2,my=(prev.y+cur.y)/2;d+=" Q "+prev.x+" "+prev.y+" "+mx+" "+my}
  const last=pts[pts.length-1];d+=" T "+last.x+" "+last.y;
  trailPath.setAttribute("d",d);
}
function pick(x,y){
  const rect=boardEl.getBoundingClientRect(),cell=boardEl.querySelector(".cell");if(!cell)return -1;
  const size=cell.getBoundingClientRect().width,gap=parseFloat(getComputedStyle(boardEl).gap)||0,step=size+gap;
  const c=Math.max(0,Math.min(COLS-1,Math.floor((x-rect.left)/step)));
  const r=Math.max(0,Math.min(ROWS-1,Math.floor((y-rect.top)/step)));
  const i=idx(r,c),p=center(i);if(!p)return -1;
  const dist=Math.hypot(x-rect.left-p.x,y-rect.top-p.y);
  return dist<=size*.78?i:-1;
}
function addIndex(i){
  if(i<0||board[i]===null||!path.length)return;
  const last=path[path.length-1];if(i===last)return;
  if(path.length>1&&i===path[path.length-2]){path.pop();render();return}
  if(path.includes(i)||board[i]!==board[path[0]]||!adjacent(last,i))return;
  path.push(i);render();
}
function traceTo(i){
  if(i<0||!path.length)return;
  const last=path[path.length-1];if(i===last)return;
  const [r0,c0]=rc(last),[r1,c1]=rc(i),steps=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));
  if(steps===0)return;
  // Fill in cells crossed between pointer samples so quick swipes don't skip over orbs.
  for(let s=1;s<=steps;s++){
    const r=Math.round(r0+(r1-r0)*s/steps),c=Math.round(c0+(c1-c0)*s/steps);
    addIndex(idx(r,c));
  }
}
function pointIndex(e){const rect=boardEl.getBoundingClientRect();return pick(e.clientX,e.clientY)}
boardEl.addEventListener("pointerdown",e=>{
  if(busy)return;const i=pointIndex(e);if(i<0||board[i]===null)return;
  e.preventDefault();pointerId=e.pointerId;boardEl.setPointerCapture(pointerId);path=[i];active=true;render();
});
boardEl.addEventListener("pointermove",e=>{
  if(!active||e.pointerId!==pointerId)return;e.preventDefault();traceTo(pointIndex(e));
});
boardEl.addEventListener("pointerup",e=>{if(!active||e.pointerId!==pointerId)return;pointerId=null;finish()});
boardEl.addEventListener("pointercancel",()=>{active=false;path=[];pointerId=null;render()});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function finish(){
  active=false;const chosen=path.slice();
  if(chosen.length<3){path=[];render();return}
  busy=true;best=Math.max(best,chosen.length);score+=chosen.length*chosen.length*10;
  chosen.forEach(i=>{const el=boardEl.querySelector('.orb[data-index="'+i+'"]');if(el)el.classList.add("popping")});
  scoreEl.textContent=score.toLocaleString("ja-JP");bestEl.textContent="BEST "+best;chainEl.textContent=chosen.length+" CHAIN";
  await wait(190);
  chosen.forEach(i=>board[i]=null);path=[];
  const fresh=new Set();
  for(let c=0;c<COLS;c++){
    const remaining=[];for(let r=ROWS-1;r>=0;r--){const v=board[idx(r,c)];if(v!==null)remaining.push(v)}
    for(let r=ROWS-1;r>=0;r--){const target=idx(r,c),v=remaining[ROWS-1-r];if(v===undefined){board[target]=randomColor();fresh.add(target)}else board[target]=v}
  }
  render(fresh);await wait(390);busy=false;chainEl.textContent="";
}
function reset(){board=Array.from({length:ROWS*COLS},randomColor);score=0;best=0;path=[];active=false;busy=false;pointerId=null;render(new Set(board.map((_,i)=>i)))}
document.getElementById("reset").addEventListener("click",()=>{if(!busy)reset()});
window.addEventListener("resize",()=>{if(path.length>1)drawTrail()});
reset();
})();
</script>
</body>
</html>
