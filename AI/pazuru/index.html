<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082b50">
<title>Color Drop</title>
<style>
:root{color-scheme:dark;--ink:#eff8ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:12px;background:radial-gradient(ellipse at 50% 0%,#2879b4 0,#125080 34%,#092e54 70%,#061b35 100%);overflow-x:hidden}
main{width:min(100%,520px);display:none}
.top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.scorebox{display:flex;align-items:baseline;gap:10px}
.scorebox small{font-size:12px;letter-spacing:.14em;color:#b4d8f2}
#score{font-size:clamp(27px,7vw,36px);font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 18px #8bd8ff55}
#best{font-size:12px;color:#c1dff5;margin-left:5px}
button{width:42px;height:42px;border:1px solid #a8dcff70;border-radius:50%;background:linear-gradient(145deg,#2875aa,#10436f);color:#effaff;font-size:21px;box-shadow:0 4px 14px #001a35aa;cursor:pointer}
button:active{transform:scale(.93)}
.arena{position:relative;width:min(100%,min(72vh,520px));aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;border:1px solid #9bdcff80;background:linear-gradient(180deg,#0b3965 0%,#092d52 55%,#071f3d 100%);box-shadow:0 22px 55px #00152eaa,inset 0 2px 12px #a7e1ff20;touch-action:none}
.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,#66c8ff20,transparent 60%),linear-gradient(90deg,#061b3520,transparent 15%,transparent 85%,#061b3520)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.under{display:flex;justify-content:space-between;align-items:center;padding:11px 5px 0;color:#b1d3ed;font-size:12px;min-height:32px}
#chain{font-size:14px;color:#fff;font-weight:750;text-shadow:0 0 10px #83d9ff}
@media(max-width:390px){body{padding:8px 7px}.arena{width:min(100%,70vh)}.top{margin-bottom:8px}}
</style>
</head>
<body>
<section id="home" class="home"><div class="home-card"><div class="logo">COLOR DROP</div><div class="home-sub">PLAY</div><button id="singleBtn" class="mode-btn" type="button">シングルプレイ</button><button id="multiBtn" class="mode-btn" type="button">マルチプレイ</button><div id="multiPanel" class="multi-panel" hidden><input id="playerName" maxlength="16" autocomplete="nickname" placeholder="名前を入力" aria-label="名前"><button id="matchBtn" class="mode-btn" type="button">対戦相手を探す</button></div><div id="homeMessage" class="home-message"></div></div></section>
<section id="resultScreen" class="home" style="display:none"><div class="home-card result-card"><div class="logo">RESULT</div><div id="resultOutcome" class="result-outcome">対戦終了</div><div class="result-scores"><div><small>YOUR SCORE</small><strong id="resultMyScore">0</strong></div><div id="opponentResultBox"><small>OPPONENT</small><strong id="resultOpponentScore">0</strong></div></div><div id="resultDetail" class="home-message"></div><button id="resultHomeBtn" class="mode-btn" type="button">ホームに戻る</button></div></section>
<main>
 <div class="top"><div class="scorebox"><small>SCORE</small><strong id="score">0</strong><span id="best">BEST 0</span><span id="matchClock"></span></div><button id="reset" type="button" aria-label="リセット" title="最初から">↻</button></div>
 <div class="arena"><canvas id="game"></canvas></div>
 <div class="under"><span id="chain"></span><span>COLOR DROP</span></div>
</main>
<style>.home{width:min(100%,520px);margin:auto;padding:18px 12px}.home-card{padding:28px 22px;border:1px solid #9bdcff70;border-radius:26px;background:linear-gradient(160deg,#155482ef,#082747f5);box-shadow:0 22px 55px #00152eaa;text-align:center}.logo{font-size:clamp(30px,8vw,46px);font-weight:900;letter-spacing:.08em;text-shadow:0 3px 20px #7bd5ff80}.home-sub{font-size:11px;letter-spacing:.35em;color:#b5dcf5;margin:5px 0 24px}.mode-btn{display:block;width:100%;height:52px;border-radius:15px;margin:10px 0;font-size:16px;font-weight:750;letter-spacing:.04em}.multi-panel{margin-top:14px;padding-top:12px;border-top:1px solid #a8dcff40}.multi-panel input{width:100%;height:48px;border:1px solid #a8dcff70;border-radius:12px;background:#06213b;color:#fff;font-size:16px;padding:0 14px;margin-bottom:4px;outline:none}.home-message{min-height:22px;margin:12px 0;color:#d9efff;font-size:13px}#matchClock{font-size:15px;font-weight:800;color:#fff;margin-left:8px;font-variant-numeric:tabular-nums}.result-outcome{font-size:27px;font-weight:900;margin:18px 0;color:#fff}.result-scores{display:flex;justify-content:center;gap:30px;margin:22px 0}.result-scores div{display:flex;flex-direction:column;gap:8px;min-width:110px}.result-scores small{font-size:11px;letter-spacing:.12em;color:#b5dcf5}.result-scores strong{font-size:clamp(25px,7vw,36px);font-variant-numeric:tabular-nums}.result-card .home-message{min-height:24px}</style>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),arena=canvas.parentElement;
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),chainEl=document.getElementById("chain");
const colors=["#ff647d","#ffd34e","#56d99a","#aa86ff"];
let W=0,H=0,D=1,R=23,balls=[],chain=[],active=false,pointer=null,pendingPointer=null,pointerMoveScheduled=false,score=0,best=0,last=0,clearing=false,accumulator=0,gravitySettling=0;
let multiplayer=false,playerId=null,matchStartAt=0,matchEndAt=0,serverTimeOffset=0,matchStarted=false,matchEnded=false,statusTimer=null,finishSent=false;
const randColor=()=>Math.floor(Math.random()*colors.length);
const rand=(a,b)=>a+Math.random()*(b-a);
const cx=()=>W/2,cy=()=>H/2,bowlRadius=()=>Math.min(W,H)*.485;
function makeBall(x,y,color=randColor(),vy=0){return{x,y,vx:rand(-8,8),vy,r:R*.94,color,sleep:false,sleepTime:0,dead:false};}
function resize(){
 const rect=arena.getBoundingClientRect();D=Math.min(devicePixelRatio||1,1.5);W=rect.width;H=rect.height;
 canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);
 R=Math.max(17,Math.min(30,W/14));
 if(!balls.length)seed();
 else for(const b of balls)confine(b);
}
function seed(){
 balls=[];const spacing=R*2.02,rowStep=R*1.82,br=bowlRadius(),inner=br-R*.98;let row=0;
 // Place the initial pile only in the upper half of the bowl.
 // The lower half stays empty so gravity can visibly gather every ball at the bottom.
 const topY=cy()-inner+R;
 const bottomY=cy()+inner*.04;
 for(let y=topY;y<=bottomY;y+=rowStep,row++){
  const half=Math.sqrt(Math.max(0,inner*inner-(y-cy())**2)),offset=row%2?R:0;
  for(let x=cx()-half+offset;x<=cx()+half;x+=spacing)balls.push(makeBall(x,y,randColor(),0));
 }
 // Start in a settled state without initial jitter.
 for(const b of balls){b.vx=0;b.vy=0;b.sleep=true;}
}
function confine(b){
 const dx=b.x-cx(),dy=b.y-cy(),dist=Math.hypot(dx,dy),limit=bowlRadius()-b.r-1;
 if(dist>limit&&dist>0){const nx=dx/dist,ny=dy/dist;b.x=cx()+nx*limit;b.y=cy()+ny*limit;}
}
function addBall(){
 // Spawn just above the visible rim; gravity carries it through the top entrance.
 balls.push(makeBall(cx()+rand(-R*.22,R*.22),cy()-bowlRadius()-R*1.25,randColor(),0));
}
function scoreUI(){scoreEl.textContent=score.toLocaleString("ja-JP");bestEl.textContent="BEST "+best;}
function nearest(x,y,maxDist,exclude=new Set()){
 let found=null,dist=maxDist;
 for(const b of balls){if(b.dead||exclude.has(b))continue;const d=Math.hypot(b.x-x,b.y-y);if(d<dist){dist=d;found=b;}}
 return found;
}
function start(e){
 if(clearing||matchEnded||(multiplayer&&!matchStarted))return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,b=nearest(x,y,R*1.35);
 if(!b)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);pointer=e.pointerId;active=true;chain=[b];chainEl.textContent="1 CHAIN";draw();
}
function processPointerMove(clientX,clientY){
 if(!active)return;
 const rect=canvas.getBoundingClientRect(),x=clientX-rect.left,y=clientY-rect.top,lastBall=chain[chain.length-1];
 if(!lastBall)return;
 // Retracing the pointer over the previous ball removes the most recently added link.
 if(chain.length>=2){
  const previous=chain[chain.length-2];
  if(Math.hypot(previous.x-x,previous.y-y)<R*2.25){
   chain.pop();chainEl.textContent=chain.length?chain.length+" CHAIN":"";return;
  }
 }
 const used=new Set(chain);
 const linkLimit=(lastBall.r+R*.94+R*.38)*1.5;
 let chosen=null,bestD=R*2.25;
 // Find the next matching orb without allocating a filtered array on every pointer event.
 for(const b of balls){
  if(b.dead||used.has(b)||b.color!==chain[0].color)continue;
  const dx=b.x-lastBall.x,dy=b.y-lastBall.y;
  if(dx*dx+dy*dy>linkLimit*linkLimit)continue;
  const px=b.x-x,py=b.y-y,d2=px*px+py*py;
  if(d2<bestD*bestD){bestD=Math.sqrt(d2);chosen=b;}
 }
 if(chosen){chain.push(chosen);chainEl.textContent=chain.length+" CHAIN";}
}
function move(e){
 if(!active||e.pointerId!==pointer)return;
 pendingPointer={x:e.clientX,y:e.clientY};
 if(pointerMoveScheduled)return;
 pointerMoveScheduled=true;
 requestAnimationFrame(()=>{
  pointerMoveScheduled=false;
  const p=pendingPointer;pendingPointer=null;
  if(p)processPointerMove(p.x,p.y);
 });
}
function end(){
 if(!active)return;
 if(pendingPointer){const p=pendingPointer;pendingPointer=null;processPointerMove(p.x,p.y);}
 active=false;pointer=null;pendingPointer=null;
 if(chain.length>=3)clearChain();else{chain=[];chainEl.textContent="";}
}
canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",end);
canvas.addEventListener("pointercancel",()=>{active=false;pointer=null;chain=[];chainEl.textContent="";draw();});
function clearChain(){
 const removed=chain.slice(),n=removed.length;
 score+=n*n*10;best=Math.max(best,n);scoreUI();
 // Remove matched balls and replenish immediately so the next chain can start on release.
 const removedSet=new Set(removed);
 balls=balls.filter(b=>!removedSet.has(b));
 chain=[];
 for(let i=0;i<n;i++)addBall();
 clearing=false;
 chainEl.textContent="";
 draw();
}
function solvePhysics(dt){
 const gravity=1350,br=bowlRadius(),entranceHalf=R*1.45;
 if(gravitySettling>0){gravitySettling=Math.max(0,gravitySettling-dt);for(const b of balls){b.sleep=false;b.sleepTime=0;}}
 for(const b of balls){
  if(b.sleep)continue;
  b.vy+=gravity*dt;b.vx*=Math.exp(-1.3*dt);b.vy*=Math.exp(-.18*dt);
  b.x+=b.vx*dt;b.y+=b.vy*dt;
 }
 // Circle wall with a narrow top-only entrance. Once a ball has crossed the rim, the wall closes behind it.
 for(let pass=0;pass<4;pass++){
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
   const a=balls[i],b=balls[j];
   // Sleeping balls never move relative to one another; skip their pair entirely.
   if(a.sleep&&b.sleep)continue;
   const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),min=a.r+b.r;
   if(dist>=min)continue;
   const d=Math.max(dist,.001),nx=dx/d,ny=dy/d,overlap=min-d;
   const ia=a.sleep?0:1,ib=b.sleep?0:1,total=ia+ib;
   if(total){const correction=Math.max(0,overlap-.001)*.52;
    a.x-=nx*correction*ia/total;a.y-=ny*correction*ia/total;
    b.x+=nx*correction*ib/total;b.y+=ny*correction*ib/total;
   }
   const rvx=(b.sleep?0:b.vx)-(a.sleep?0:a.vx),rvy=(b.sleep?0:b.vy)-(a.sleep?0:a.vy),along=rvx*nx+rvy*ny;
   if(along<0&&total){
    const impulse=-(1.02)*along/total;
    if(!a.sleep){a.vx-=impulse*nx;a.vy-=impulse*ny;a.sleepTime=0;}
    if(!b.sleep){b.vx+=impulse*nx;b.vy+=impulse*ny;b.sleepTime=0;}
    if(Math.abs(along)>7){a.sleep=false;b.sleep=false;}
   }
  }
  for(const b of balls){
   const dx=b.x-cx(),dy=b.y-cy(),dist=Math.hypot(dx,dy),limit=br-b.r-1;
   // Only a ball still completely above the rim may enter through the narrow top gap.
   const entering=dy<0&&Math.abs(dx)<entranceHalf&&b.y < cy()-br+b.r*1.35&&b.vy>=0;
   if(dist>limit&&!entering){
    const nx=dx/(dist||1),ny=dy/(dist||1);b.x=cx()+nx*limit;b.y=cy()+ny*limit;
    const outward=(b.sleep?0:b.vx)*nx+(b.sleep?0:b.vy)*ny;
    if(outward>0){b.vx-=1.04*outward*nx;b.vy-=1.04*outward*ny;}
   }
  }
 }
 for(const b of balls){
  if(b.sleep)continue;
  const speed=Math.hypot(b.vx,b.vy);
  if(gravitySettling>0){b.sleepTime=0;continue;}
  if(speed<7){b.sleepTime+=dt;if(b.sleepTime>.65){b.vx=0;b.vy=0;b.sleep=true;}}
  else b.sleepTime=0;
 }
 // Remove only if a ball somehow fell far outside due to an exceptional frame; replace it at the entry.
 for(let i=0;i<balls.length;i++){
  const b=balls[i];if(b.y>H+R*4){balls.splice(i--,1);addBall();}
 }
}
function drawBall(b){
 const grad=ctx.createRadialGradient(b.x-b.r*.36,b.y-b.r*.43,b.r*.06,b.x,b.y,b.r*1.12);
 grad.addColorStop(0,"#ffffff");grad.addColorStop(.12,colors[b.color]);grad.addColorStop(.68,colors[b.color]);grad.addColorStop(1,"#152b53");
 ctx.save();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowBlur=0;
 ctx.lineWidth=1;ctx.strokeStyle="#ffffff70";ctx.stroke();
 ctx.beginPath();ctx.ellipse(b.x-b.r*.23,b.y-b.r*.43,b.r*.38,b.r*.17,-.48,0,Math.PI*2);ctx.fillStyle="#ffffff9c";ctx.fill();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const light=ctx.createRadialGradient(W*.5,0,5,W*.5,H*.35,H*.85);light.addColorStop(0,"#65bfff12");light.addColorStop(1,"#00152a00");ctx.fillStyle=light;ctx.fillRect(0,0,W,H);
 for(const b of balls)drawBall(b);
 if(chain.length){ctx.save();ctx.beginPath();ctx.moveTo(chain[0].x,chain[0].y);for(let i=1;i<chain.length;i++)ctx.lineTo(chain[i].x,chain[i].y);ctx.lineWidth=R*.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#ffffffd9";ctx.shadowColor="#8be2ff";ctx.shadowBlur=chain.length>20?5:12;ctx.stroke();ctx.shadowBlur=0;ctx.beginPath();for(const b of chain){ctx.moveTo(b.x+b.r+2,b.y);ctx.arc(b.x,b.y,b.r+2,0,Math.PI*2);}ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();ctx.restore();}
}
function loop(t){
 if(multiplayer&&!matchEnded&&matchStartAt>0&&matchEndAt>0){
  const now=Date.now()+serverTimeOffset;
  if(!matchStarted){
   const untilStart=Math.max(0,Math.ceil((matchStartAt-now)/1000));
   homeMessage.textContent=untilStart>0?"対戦相手が見つかりました。開始まで "+untilStart+" 秒":"対戦開始";
   document.getElementById("matchClock").textContent="";
   if(now>=matchStartAt){
    matchStarted=true;
    home.style.display="none";
    main.style.display="block";
    startGravity();
    last=0;accumulator=0;
   }
  }
  if(matchStarted){
   const left=Math.max(0,Math.ceil((matchEndAt-now)/1000));
   document.getElementById("matchClock").textContent=left+"s";
   if(left<=0)finishMatch();
  }
 }
 const elapsed=last?Math.min((t-last)/1000,.04):1/60;last=t;accumulator+=elapsed;
 const fixed=1/60;while(accumulator>=fixed){solvePhysics(fixed);accumulator-=fixed;}
 draw();requestAnimationFrame(loop);
}
function reset(){score=0;best=0;chain=[];active=false;pointer=null;clearing=false;seed();scoreUI();chainEl.textContent="";}
document.getElementById("reset").addEventListener("click",()=>{if(!multiplayer)reset();});

const home=document.getElementById("home"),main=document.querySelector("main"),homeMessage=document.getElementById("homeMessage"),multiPanel=document.getElementById("multiPanel"),nameInput=document.getElementById("playerName");
function syncServerClock(data){if(Number.isFinite(data.serverNow))serverTimeOffset=data.serverNow-Date.now();}
function startGravity(){gravitySettling=4;for(const b of balls){b.sleep=false;b.sleepTime=0;b.vx=rand(-14,14);b.vy=rand(-3,3);}}
function showGame(){home.style.display="none";main.style.display="block";reset();startGravity();}
function showResult(mine,other,opponentName=""){home.style.display="none";main.style.display="none";const screen=document.getElementById("resultScreen");screen.style.display="block";document.getElementById("resultMyScore").textContent=Number(mine||0).toLocaleString("ja-JP");const box=document.getElementById("opponentResultBox");if(other!==null&&other!==undefined){box.style.display="flex";document.getElementById("resultOpponentScore").textContent=Number(other).toLocaleString("ja-JP");const a=Number(mine||0),b=Number(other);document.getElementById("resultOutcome").textContent=a>b?"WIN":a<b?"LOSE":"DRAW";document.getElementById("resultDetail").textContent=opponentName?opponentName+" との対戦結果":"対戦結果";}else{box.style.display="none";document.getElementById("resultOutcome").textContent="FINISH";document.getElementById("resultDetail").textContent="シングルプレイの結果";}}
document.getElementById("resultHomeBtn").addEventListener("click",()=>{document.getElementById("resultScreen").style.display="none";showHome("");playerId=null;multiplayer=false;matchStarted=false;matchEnded=false;finishSent=false;});
function showHome(message=""){main.style.display="none";home.style.display="block";homeMessage.textContent=message;document.getElementById("matchClock").textContent="";}
document.getElementById("singleBtn").addEventListener("click",()=>{multiplayer=false;playerId=null;matchEnded=false;matchStarted=true;showGame();});
document.getElementById("multiBtn").addEventListener("click",()=>{multiPanel.hidden=false;homeMessage.textContent="名前を入力して対戦相手を探してください";});
document.getElementById("matchBtn").addEventListener("click",async()=>{const name=nameInput.value.trim();if(!name){homeMessage.textContent="名前を入力してください";return;}const button=document.getElementById("matchBtn");button.disabled=true;homeMessage.textContent="対戦相手を探しています（最大20秒）...";try{const r=await fetch("/AI/pazuru/api/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});if(!r.ok)throw Error();const data=await r.json();playerId=data.playerId;multiplayer=true;matchEnded=false;matchStarted=false;finishSent=false;syncServerClock(data);matchStartAt=Number(data.startAt)||0;matchEndAt=Number(data.endsAt)||0;reset();home.style.display="block";main.style.display="none";if(data.state==="waiting"){homeMessage.textContent="対戦相手を探しています（最大20秒）...";}else{homeMessage.textContent="対戦相手が見つかりました。開始を待っています...";}statusTimer=setInterval(checkMatchStatus,500);}catch{homeMessage.textContent="対戦サーバーに接続できません。時間をおいて再試行してください";button.disabled=false;}});
async function checkMatchStatus(){if(!playerId)return;try{const r=await fetch("/AI/pazuru/api/status?id="+encodeURIComponent(playerId),{cache:"no-store"});if(!r.ok)throw Error();const data=await r.json();syncServerClock(data);if(data.state==="waiting"){home.style.display="block";main.style.display="none";homeMessage.textContent="対戦相手を探しています（最大20秒）...";return;}
if(data.state==="gone"){clearInterval(statusTimer);statusTimer=null;playerId=null;document.getElementById("matchBtn").disabled=false;showHome("待機情報が失われました。もう一度対戦相手を探してください。");return;}if(data.state==="countdown"||data.state==="playing"){if(data.startAt)matchStartAt=Number(data.startAt);if(data.endsAt)matchEndAt=Number(data.endsAt);if(!matchStarted){home.style.display="block";main.style.display="none";}}if(data.completed&&matchEnded){clearInterval(statusTimer);const mine=data.myScore??score,other=data.opponentScore;showResult(mine,other,data.opponent||"");document.getElementById("matchBtn").disabled=false;}else if(matchEnded){home.style.display="none";main.style.display="none";document.getElementById("resultScreen").style.display="block";document.getElementById("resultOutcome").textContent="集計中";document.getElementById("resultMyScore").textContent=score.toLocaleString("ja-JP");document.getElementById("opponentResultBox").style.display="none";document.getElementById("resultDetail").textContent="相手のプレイ終了を待っています...";}}catch{}}
async function finishMatch(){if(finishSent)return;finishSent=true;matchEnded=true;active=false;chain=[];chainEl.textContent="";document.getElementById("matchClock").textContent="0s";try{await fetch("/AI/pazuru/api/finish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:playerId,score})});}catch{}home.style.display="none";main.style.display="none";document.getElementById("resultScreen").style.display="block";document.getElementById("resultOutcome").textContent="集計中";document.getElementById("resultMyScore").textContent=score.toLocaleString("ja-JP");document.getElementById("opponentResultBox").style.display="none";document.getElementById("resultDetail").textContent="相手のプレイ終了を待っています...";if(statusTimer)clearInterval(statusTimer);statusTimer=setInterval(checkMatchStatus,1000);checkMatchStatus();}
window.addEventListener("pagehide",()=>{if(playerId)navigator.sendBeacon("/AI/pazuru/api/leave",new Blob([JSON.stringify({id:playerId})],{type:"application/json"}));});
new ResizeObserver(resize).observe(arena);resize();scoreUI();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
